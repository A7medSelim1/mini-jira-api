openapi: 3.0.3
info:
  title: Mini Jira API
  version: 1.0.0
  description: Production-grade RESTful API for Mini Jira Project Management System.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Public endpoint for JWT user login.
        Returns access and refresh tokens along with basic user profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token to invalidate user session.
      summary: User Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Fetch authenticated user profile information.
      summary: Retrieve Current Profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Update profile fields (first_name, last_name) for current user.
      summary: Update Profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Public endpoint for refreshing access token using refresh token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new user account with email, password, and optional
        names.
      summary: User Registration
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/comments/{id}/:
    get:
      operationId: comments_retrieve
      description: Fetch detailed comment information.
      summary: Retrieve Comment Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    patch:
      operationId: comments_partial_update
      description: Update comment text. Only comment author is allowed.
      summary: Update Comment Content
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      description: Soft-delete a comment. Requires comment author permission or Project
        Reporter moderation permission.
      summary: Soft-Delete Comment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/:
    get:
      operationId: projects_list
      description: Fetch all projects the authenticated user can access (as reporter
        or team member).
      summary: List Accessible Projects
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: reporter
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: Create a new project. Current authenticated user automatically
        becomes the project reporter.
      summary: Create Project
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: Fetch project information including assigned teams.
      summary: Retrieve Project Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: Update project title or description. Project Reporter permission
        required.
      summary: Update Project Settings
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: Soft-delete a project. Project Reporter permission required.
      summary: Archive / Soft-Delete Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/{id}/teams/:
    post:
      operationId: projects_teams_create
      description: Assign a team to the specified project. Requires Project Reporter
        permissions.
      summary: Assign Team to Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectTeamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectTeamRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectTeamRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTeam'
          description: ''
  /api/v1/projects/{id}/teams/{team_id}/:
    delete:
      operationId: projects_teams_destroy
      description: Remove a team assignment from a project. Requires Project Reporter
        permissions.
      summary: Remove Team from Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/{project_id}/activities/:
    get:
      operationId: projects_activities_list
      description: Fetch immutable audit log trail of events occurring within the
        project.
      summary: List Project Activity History
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/v1/projects/{project_id}/tasks/:
    get:
      operationId: projects_tasks_list
      description: Fetch tasks for a specific project. Supports filtering, text search,
        safe ordering, and pagination.
      summary: List Project Tasks
      parameters:
      - in: query
        name: assignee
        schema:
          type: number
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - URGENT
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
          * `URGENT` - Urgent
      - in: query
        name: project
        schema:
          type: number
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DONE
          - IN_PROGRESS
          - READY_FOR_REVIEW
          - TODO
        description: |-
          * `TODO` - To Do
          * `IN_PROGRESS` - In Progress
          * `READY_FOR_REVIEW` - Ready For Review
          * `DONE` - Done
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
    post:
      operationId: projects_tasks_create
      description: Create a new task in the project. Assignee must belong to an assigned
        team or be reporter.
      summary: Create Task
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/:
    get:
      operationId: tasks_list
      description: Fetch tasks across all accessible projects. Supports filtering,
        full-text search, safe ordering, and pagination.
      summary: Global Task List
      parameters:
      - in: query
        name: assignee
        schema:
          type: number
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - URGENT
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
          * `URGENT` - Urgent
      - in: query
        name: project
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DONE
          - IN_PROGRESS
          - READY_FOR_REVIEW
          - TODO
        description: |-
          * `TODO` - To Do
          * `IN_PROGRESS` - In Progress
          * `READY_FOR_REVIEW` - Ready For Review
          * `DONE` - Done
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}/:
    get:
      operationId: tasks_retrieve
      description: Fetch detailed task information.
      summary: Retrieve Task Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: tasks_partial_update
      description: Update title, description, or priority. Direct status modifications
        are blocked; status must be transitioned using POST /api/v1/tasks/{id}/transition/.
      summary: Update Task Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: tasks_destroy
      description: Soft-delete a task from the project.
      summary: Soft-Delete Task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/{id}/assign/:
    post:
      operationId: tasks_assign_create
      description: Assign task to an eligible user (must belong to a team assigned
        to the project). Project Reporter permission required.
      summary: Assign / Reassign Task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}/transition/:
    post:
      operationId: tasks_transition_create
      description: Executes a state machine transition (TODO -> IN_PROGRESS -> READY_FOR_REVIEW
        -> DONE / TODO). Role restrictions enforced per transition.
      summary: Transition Task Workflow Status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskTransitionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/activities/:
    get:
      operationId: tasks_activities_list
      description: Fetch immutable audit log trail of events for a specific task.
      summary: List Task Activity History
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/v1/tasks/{task_id}/comments/:
    get:
      operationId: tasks_comments_list
      description: Fetch all active comments associated with the specified task.
      summary: List Task Comments
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
    post:
      operationId: tasks_comments_create
      description: Add a new comment to the specified task. Author automatically set
        to request.user.
      summary: Add Task Comment
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/v1/teams/:
    get:
      operationId: teams_list
      description: Fetch all teams created by or assigned to the current user.
      summary: List User Teams
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
    post:
      operationId: teams_create
      description: Create a new team. Creator automatically becomes a member.
      summary: Create Team
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeamRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeamRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/v1/teams/{id}/:
    get:
      operationId: teams_retrieve
      description: Fetch detailed team information.
      summary: Retrieve Team Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    patch:
      operationId: teams_partial_update
      description: |-
        GET /api/v1/teams/{id}/ - Retrieve team details.
        PATCH /api/v1/teams/{id}/ - Update team details.
        DELETE /api/v1/teams/{id}/ - Delete team.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTeamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTeamRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTeamRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    delete:
      operationId: teams_destroy
      description: |-
        GET /api/v1/teams/{id}/ - Retrieve team details.
        PATCH /api/v1/teams/{id}/ - Update team details.
        DELETE /api/v1/teams/{id}/ - Delete team.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/teams/{id}/members/:
    get:
      operationId: teams_members_list
      description: Fetch list of users enrolled in the team.
      summary: List Team Members
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMembership'
          description: ''
    post:
      operationId: teams_members_create
      description: Add a user to the team using user_id or email.
      summary: Add Team Member
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeamMembershipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeamMembershipRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembership'
          description: ''
  /api/v1/teams/{id}/members/{user_id}/:
    delete:
      operationId: teams_members_destroy
      description: Remove a user from the specified team.
      summary: Remove Team Member
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
