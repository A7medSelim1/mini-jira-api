        * `TASK_UPDATED` - Task Details Updated
        * `TASK_ASSIGNED` - Task Assignee Changed
        * `TASK_STATUS_CHANGED` - Task Status Changed
        * `COMMENT_ADDED` - Comment Added
        * `COMMENT_DELETED` - Comment Deleted
